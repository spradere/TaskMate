################################################################################
# allowed source access system critical headers
################################################################################

{
pattern hal/public/context.h
allow {
	system/sysCore/modules.c 
	system/sysCore/tm_scheduler.c
	}
}

{
pattern hal/public/stack.h
allow { 
	system/sysCore/tm_scheduler.c
	}
}

{
pattern hal/public/interrupt.h
allow { 
	hal/public/panic.h 
	system/sysCore/tm_scheduler.c
	}
}

{
pattern system/sysCore/runLevel.h
allow { 
	system/sysCore/runLevel.c 
	autoCode/autoCode.c 
	autoCode/autoCode.h 
	system/sysCore/boot.c
	}
}

{
pattern interfaces/modules_define.h
allow { 
	system/sysCore/modules.h 
	autoCode/autoCode.c 
	autoCode/autoCode.h 
	hal/arch/avr8/context.c
	}
}

{
pattern interfaces/runLevel_define.h
allow { 
	system/sysCore/runLevel.h 
	system/sysCore/boot.c
	}
}

{
pattern system/sysCore/modules_list.h
allow { 
	autoCode/autoCode.c 
	system/sysCore/modules.c
	}
}

{
pattern system/sysCore/hal_init.h
allow { 
	autoCode/autoCode.c 
	system/sysCore/boot.c 
	system/sysCore/gpio.c
	}
}
